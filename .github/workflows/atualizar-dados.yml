name: Atualizar dados
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Recuperar o que ja foi baixado
        uses: actions/cache/restore@v4
        with:
          path: ~/.magicb3_cache
          key: magicb3-dados-${{ github.run_id }}
          restore-keys: magicb3-
      - name: Verificar as fontes de dados
        continue-on-error: true
        run: python verificar_dados.py
      - name: Rodar os testes
        run: python -m pytest tests -q
      - name: Gerar o dados.json
        run: python atualizar_dados.py --pool 80 --fundamentos web/public/fundamentos.json
      - name: Conferir o resultado
        run: python validar_dados.py
      - name: Publicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          test -f web/public/dados.json || (echo "Arquivo nao foi gerado." && exit 1)
          cp web/public/dados.json /tmp/gerado.json
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p $(dirname web/public/dados.json)
            cp /tmp/gerado.json web/public/dados.json
            git add web/public/dados.json
            if git diff --staged --quiet; then
              echo "Nada mudou."
              exit 0
            fi
            git commit -m "Atualizacao automatica dos dados"
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi
            echo "Alguem publicou antes; refazendo em cima do main atual."
            sleep 5
          done
          echo "Nao consegui publicar depois de 5 tentativas."
          exit 1
      - name: Guardar o progresso mesmo se falhar
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.magicb3_cache
          key: magicb3-dados-${{ github.run_id }}
